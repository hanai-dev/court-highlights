# CI on the owner-laptop profile (DEV-ENVIRONMENTS): the same build image, compose stack and Playwright suite as a
# developer machine, with replayed footage as RTSP cameras. Nothing here reaches a live venue or a deploy target.
# Fast checks run on every push; the full e2e suite (about 20 minutes, split over four runners) on pull requests, on
# demand, and before every release (release.yml calls this workflow).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the full e2e suite (about 20 minutes, split over four runners)
        type: boolean
        default: true
  # From release.yml, which is started by hand: github.event_name is the caller's workflow_dispatch, so the e2e
  # job's condition below holds with this input too.
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false

concurrency:
  # By trigger as well: a push never cancels an e2e run started by hand. Called from release.yml, github.workflow is
  # "release", so a release and a hand-started run never cancel each other either.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false # no build-record artifact per image build

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image-cache: ${{ steps.day.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      # The image comes from the Actions cache, keyed by day: the first run of a day builds it fresh, so the OS scan
      # below never judges packages older than a day. The e2e shards read the same cache entry.
      - name: Image cache key
        id: day
        run: echo "scope=ch-dev-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image (Ubuntu 26.04, Rust 1.99, GStreamer)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/dev.Dockerfile
          tags: ch-dev:0
          load: true
          cache-from: type=gha,scope=${{ steps.day.outputs.scope }}
          cache-to: type=gha,scope=${{ steps.day.outputs.scope }},mode=max
      - name: Cache volumes
        run: docker volume create ch-target && docker volume create ch-cargo-registry
      - name: Format, lint, unit tests, build (also without test hooks, as releases are built)
        run: >-
          docker compose -p ch-test -f docker/compose.test.yaml --profile build run --rm builder sh -c
          "cargo fmt --all --check
          && cargo clippy -p ch-box -p ch-core --features test-hooks -- -D warnings
          && cargo test -p ch-box -p ch-core --features test-hooks
          && cargo build -p ch-box
          && cargo build -p ch-box --features test-hooks
          && cargo metadata --format-version 1 --locked > target/box-metadata.json
          && sh tools/gst-licence-check.sh target/debug/ch-box"
      - name: Crate licences
        run: |
          docker run --rm -v ch-target:/t alpine:3.22 cat /t/box-metadata.json > box-metadata.json
          node tools/licence-check.cjs box-metadata.json
      - name: Keep the test build for e2e (the last build above, with test hooks; outside the checkout the scans read)
        run: docker run --rm -v ch-target:/t alpine:3.22 cat /t/debug/ch-box > "$RUNNER_TEMP/ch-box"
      - uses: actions/upload-artifact@v5
        with:
          name: ch-box-test-hooks
          path: ${{ runner.temp }}/ch-box
          retention-days: 1
      - name: Box system packages (SEC-DEPENDENCIES)
        # The build image is Ubuntu 26.04 plus GStreamer, the box's own base, with build tools on top: a superset of
        # what the install image ships, so a clean scan here is clean there.
        run: |
          set -o pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --quiet --pkg-types os \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ch-dev:0 | tee box-os-scan.txt
      - name: Venue-network only (no online service, no player email)
        run: node --test tests/local-only.test.cjs
      - name: Advisories and leaked credentials
        run: sh tools/supply-chain-scan.sh .
      - name: Payload and support horizon
        run: node tools/payload-check.cjs && node tools/horizon-check.cjs

  e2e:
    needs: checks
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Every spec starts from freshBox(), so spec files split across runners, each with its own box stack. Four shards
    # came out even (4.6 to 6.0 minutes each); five left one at 7.3.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # No clean-up step: the runner disk is 145 GB with about 100 GB free, and a shard holds only the image, the browsers
    # and its own specs' footage.
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (from the checks job's cache)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/dev.Dockerfile
          tags: ch-dev:0
          load: true
          cache-from: type=gha,scope=${{ needs.checks.outputs.image-cache }}
      - uses: actions/download-artifact@v5
        with:
          name: ch-box-test-hooks
          path: ${{ runner.temp }}
      - name: Test build into the target volume (where the boxes seed from)
        run: |
          docker volume create ch-target && docker volume create ch-cargo-registry
          docker run --rm -v ch-target:/t -v "$RUNNER_TEMP:/in" alpine:3.22 install -D -m 755 /in/ch-box /t/debug/ch-box
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Playwright's system packages (most are WebKit's, for the iPhone check in clips.spec.ts) come from the Ubuntu
      # mirror, which has crawled at 86 kB/s (117 MB in 22 minutes). apt downloads them into a folder the Actions cache
      # keeps, keyed by the Playwright version; packages a newer runner image adds still come from the mirror.
      - name: Playwright system packages (cache)
        uses: actions/cache@v6
        with:
          path: ~/playwright-debs/*.deb
          key: playwright-debs-ubuntu-24.04-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          mkdir -p ~/playwright-debs/partial
          echo "Dir::Cache::Archives \"$HOME/playwright-debs/\";" | sudo tee /etc/apt/apt.conf.d/99playwright-debs
          npx playwright install --with-deps chromium webkit
          set -o pipefail
          npx playwright test --shard=${{ matrix.shard }}/4 2>&1 | tee test-results-e2e.txt
      - name: Logs hold no player data (SEC-LOGS-NO-PII)
        if: always()
        # The suite's own passwords (test-only values from tests/e2e/specs) must never appear in a log.
        run: >-
          set -o pipefail; node tools/log-pii-scan.cjs tests/e2e/test-results/service-logs.txt
          court-box-owner-pass-1 ken-own-password-2026 ken-second-password-26 sam-own-password-2026
          cam-pass-1 | tee tests/e2e/log-pii-scan.txt
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            tests/e2e/test-results-e2e.txt
            tests/e2e/results.json
            tests/e2e/log-pii-scan.txt
            tests/e2e/test-results
          retention-days: 30

  e2e-gate:
    # The one check called "e2e" that the main ruleset requires, whatever the shard count. Skipped where the shards
    # are (a push to main); red if any shard failed or was cancelled.
    name: e2e
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e.result }}" = success
