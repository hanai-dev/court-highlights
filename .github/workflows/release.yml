# Cuts a release when the owner starts it (Actions → release → Run workflow): the full CI, e2e included, on this
# commit; then semantic-release takes the version from the Conventional Commits since the last tag, stamps it into
# the crates in this run's checkout only, builds the box executable (tools/release/build.sh), tags the commit, and
# publishes the GitHub release (notes + executable) with a provenance attestation of the executable. Nothing is
# committed back: main only takes PRs. The owner checks the provenance and signs the executable into an update file
# offline (tools/release/make-update.sh, RUNBOOK §4). Started on the `rc` branch (always a fast-forward of main), it
# publishes a pre-release instead, `v<version>-rc.N`, for the test box.
name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # the provenance attestation (Sigstore signing)
      attestations: write
    steps:
      - name: Make room (a release Rust build)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag and commit since the last release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build image (Ubuntu 26.04, Rust 1.99, GStreamer)
        run: docker build -t ch-dev:0 -f docker/dev.Dockerfile docker
      - name: Release tooling
        working-directory: tools/release
        run: npm ci
      - name: Release
        # A push to main after this run started leaves the checkout behind the remote; semantic-release then
        # publishes nothing rather than release a commit CI did not test.
        run: tools/release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Provenance of the executable (the owner checks it before signing)
        # Only when a release was published; semantic-release builds nothing when there is nothing to release.
        if: hashFiles('dist/ch-box-*-linux-x86_64') != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ch-box-*-linux-x86_64
