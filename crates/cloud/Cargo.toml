[package]
name = "ch-cloud"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
description = "Online service: receives finished clips from court boxes, emails take-home links, runs the fleet console."

[workspace]

[features]
# Test-only hooks (moving the service clock for expiry tests). Never enabled in release images.
test-hooks = []

[dependencies]
ch-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["set-header"] }
askama = "0.16"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "chrono", "migrate", "macros"] }
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.153", default-features = false, features = ["rt-tokio", "behavior-version-latest", "http-1x"] }
aws-sdk-sesv2 = { version = "1.141", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
argon2 = "0.6"
totp-rs = { version = "6", default-features = false, features = ["std"] }
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.11"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug builds keep line tables only, and none for dependencies: the test target stays a few GB (the build disk is small).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
