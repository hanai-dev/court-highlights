<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f6f4ee;color:#1b1b1b;font:16px/1.5 Arial,Helvetica,sans-serif">
  <p style="font-weight:700;margin:0 0 4px">{{ venue }}</p>
  <h1 style="font-size:22px;margin:0 0 16px">{{ title }}</h1>
  <p style="margin:0 0 16px">Your videos are {{ until }}.</p>
  <p style="margin:0 0 24px"><a href="{{ page }}" style="display:inline-block;background:#ffe14d;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:4px;padding:12px 20px;font-weight:700;text-decoration:none">See and download your videos</a></p>
  <ul style="padding-left:20px;margin:0 0 24px">
    {% for l in lines %}<li><a href="{{ base }}/v/{{ token }}/{{ l.id }}" style="color:#1b1b1b">{{ l.label }}</a></li>{% endfor %}
  </ul>
  <p style="font-size:14px;color:#4a4a46;margin:0"><a href="{{ never }}" style="color:#4a4a46">This isn't me — don't email me again</a></p>
</body>
</html>
