{% if !f.errors.is_empty() %}
<div class="error-summary" role="alert" tabindex="-1" autofocus aria-labelledby="error-summary-h" data-error-summary>
  <h2 id="error-summary-h">{% if f.errors.len() == 1 %}Check this{% else %}Check these {{ f.errors.len() }} things{% endif %}</h2>
  <ul>{% for e in f.errors %}<li><a href="#{{ e.field }}">{{ e.message }}</a></li>{% endfor %}</ul>
</div>
{% endif %}
