[package]
name = "ch-box"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Court box: records courts, cuts branded clips, judges highlights, serves the court page and staff console."

[dependencies]
ch-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "signal", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
retina = "0.4.21"
gstreamer = "0.25"
ort = "=2.0.0-rc.15"
rusqlite = { version = "0.40", features = ["bundled"] }
askama = "0.16"
argon2 = "0.6"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
