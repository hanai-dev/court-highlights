<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">A pickleball court seen from above, with the camera mounted high at the centre of one end and the court sign on the net post</title>
  <g fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- court in perspective -->
    <path d="M150 340 L490 340 L430 120 L210 120 Z"/>
    <!-- net -->
    <path d="M178 230 L462 230" stroke-width="5"/>
    <path d="M178 230 L178 200 M462 230 L462 200"/>
    <!-- kitchen (non-volley) lines -->
    <path d="M165 285 L475 285 M193 177 L447 177"/>
    <!-- centre lines -->
    <path d="M320 340 L320 285 M320 177 L320 120"/>
    <!-- camera pole and camera, high and centred behind the far baseline -->
    <path d="M320 120 L320 40"/>
    <rect x="296" y="22" width="48" height="24" rx="4"/>
    <circle cx="320" cy="34" r="6"/>
    <path d="M296 46 L250 112 M344 46 L390 112" stroke-dasharray="6 8" stroke-width="2"/>
    <!-- court sign on the near net post -->
    <rect x="474" y="200" width="44" height="58" rx="4"/>
    <path d="M462 214 L474 214"/>
    <rect x="482" y="208" width="14" height="14" stroke-width="2"/>
    <rect x="500" y="208" width="10" height="10" stroke-width="2"/>
    <rect x="482" y="228" width="10" height="10" stroke-width="2"/>
    <path d="M482 246 L510 246" stroke-width="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1b1b1b">
    <text x="356" y="30">Camera: high, centred</text>
    <text x="356" y="48" font-weight="400">5–7 m up, sees the whole court</text>
    <text x="528" y="226">Court</text>
    <text x="528" y="244">sign</text>
  </g>
</svg>
