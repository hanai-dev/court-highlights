# Test stack for e2e runs on a developer machine or CI. Uses the binary built into the shared `ch-target` volume:
#   docker compose -f docker/compose.test.yaml run --rm builder     # cargo build --features test-hooks
#   docker compose -f docker/compose.test.yaml up -d box-a
name: ch-test

x-box: &box
  image: ch-dev:0
  working_dir: /work
  command: ["./target/debug/ch-box"]
  volumes:
    - ../:/work
    - ch-target:/work/target
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  builder:
    image: ch-dev:0
    working_dir: /work
    profiles: ["build"]
    command: ["cargo", "build", "-p", "ch-box", "--features", "test-hooks"]
    volumes:
      - ../:/work
      - ch-target:/work/target
      - ch-cargo-registry:/usr/local/cargo/registry

  # Fake cameras (test-only tooling): MediaMTX + one FFmpeg publisher per court. Stopping cam-N = unplugging it.
  rtsp:
    image: ch-dev:0
    command: ["mediamtx", "/work/tools/spike/mediamtx.yml"]
    volumes: ["../:/work"]
    ports: ["18554:8554"]
  cam-1: # offers an audio track too: the box must never record it (FR-2)
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1920x1080:rate=15 -re -f lavfi -i sine=frequency=440 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3M -g 30 -c:a aac -f rtsp rtsp://rtsp:8554/court1; do sleep 1; done"]
  cam-2:
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1920x1080:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3M -g 30 -f rtsp rtsp://rtsp:8554/court2; do sleep 1; done"]

  cam-3: # 640x360 with audio and a 1 s keyframe interval: clip tests stay quick with software encoding
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=15 -re -f lavfi -i sine=frequency=440 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 800k -g 15 -c:a aac -f rtsp rtsp://rtsp:8554/court3; do sleep 1; done"]

  cam-4: # rallies and dead time (black) in a 20 s cycle, with audio: the shot judge finds 6 s and 8 s points
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=15 -re -f lavfi -i sine=frequency=330 -vf \"drawbox=c=black:t=fill:enable='lt(mod(t,20),4)+between(mod(t,20),10,12)'\" -c:v libx264 -preset ultrafast -tune zerolatency -b:v 800k -g 15 -c:a aac -f rtsp rtsp://rtsp:8554/court4; do sleep 1; done"]

  box-a:
    <<: *box
    environment: { CH_DATA_DIR: /data, CH_HTTP_ADDR: "0.0.0.0:80", CH_HTTPS_ADDR: "0.0.0.0:443", CH_BOX_NAME: box-a, CH_PLAYER_URL: "http://localhost:18080", CH_SUPPORT_PHONE: "0917 555 0100" }
    volumes:
      - ../:/work
      - ch-target:/work/target
      - box-a-data:/data
    ports: ["18080:80", "18443:443"]

volumes:
  ch-target: { external: true }
  ch-cargo-registry: { external: true }
  box-a-data: {}
