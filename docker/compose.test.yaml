# Test stack for e2e runs on a developer machine or CI. Uses the binary built into the shared `ch-target` volume:
#   docker compose -f docker/compose.test.yaml run --rm builder     # cargo build --features test-hooks
#   docker compose -f docker/compose.test.yaml up -d box-a
name: ch-test

x-box: &box
  image: ch-dev:0
  working_dir: /work
  # As on the N150: the launcher runs ch-box from its active update slot and takes failed updates back. The slots
  # live in the container (seeded from the build at each new container), so a fresh build is always what starts.
  command: ["sh", "/work/tools/box-launcher.sh"]
  # CH_RELEASE_KEY on each box is the public half of tests/fixtures/release-test.pk8, a test-only signing key.
  volumes:
    - ../:/work
    - ch-target:/work/target
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  builder:
    image: ch-dev:0
    working_dir: /work
    profiles: ["build"]
    # The online service is its own workspace; both build into the shared target volume.
    command: ["cargo", "build", "-p", "ch-box", "--features", "test-hooks"]
    environment: { CARGO_TARGET_DIR: /work/target }
    volumes:
      - ../:/work
      - ch-target:/work/target
      - ch-cargo-registry:/usr/local/cargo/registry

  # Fake cameras (test-only tooling): MediaMTX + one FFmpeg publisher per court. Stopping cam-N = unplugging it.
  rtsp:
    image: ch-dev:0
    command: ["mediamtx", "/work/tools/spike/mediamtx.yml"]
    volumes: ["../:/work"]
    ports: ["18554:8554"]
  cam-1: # offers an audio track too: the box must never record it (FR-2)
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1920x1080:rate=15 -re -f lavfi -i sine=frequency=440 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3M -g 30 -c:a aac -f rtsp rtsp://rtsp:8554/court1; do sleep 1; done"]
  cam-2:
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1920x1080:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3M -g 30 -f rtsp rtsp://rtsp:8554/court2; do sleep 1; done"]

  cam-3: # 640x360 with audio and a 1 s keyframe interval: clip tests stay quick with software encoding
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=15 -re -f lavfi -i sine=frequency=440 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 800k -g 15 -c:a aac -f rtsp rtsp://rtsp:8554/court3; do sleep 1; done"]

  cam-4: # rallies and dead time (black) in a 20 s cycle, with audio: the shot judge finds 6 s and 8 s points
    image: ch-dev:0
    depends_on: [rtsp]
    command: ["bash", "-c", "until ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=15 -re -f lavfi -i sine=frequency=330 -vf \"drawbox=c=black:t=fill:enable='lt(mod(t,20),4)+between(mod(t,20),10,12)'\" -c:v libx264 -preset ultrafast -tune zerolatency -b:v 800k -g 15 -c:a aac -f rtsp rtsp://rtsp:8554/court4; do sleep 1; done"]

  # A test-only ONVIF camera: answers discovery probes and Media calls; its stream is cam-3 (court3).
  onvif-cam:
    image: node:24.11.0-alpine3.22
    command: ["node", "/work/tests/fixtures/fake-onvif.cjs"]
    environment: { ONVIF_HOST: onvif-cam, ONVIF_STREAM: "rtsp://rtsp:8554/court3" }
    volumes: ["../:/work"]

  box-a:
    <<: *box
    environment: { CH_DATA_DIR: /data, CH_HTTP_ADDR: "0.0.0.0:80", CH_HTTPS_ADDR: "0.0.0.0:443", CH_BOX_NAME: box-a, CH_PLAYER_URL: "http://localhost:18080", CH_SUPPORT_PHONE: "0917 555 0100", CH_SLOTS_DIR: /opt/court-highlights, CH_SEED_BINARY: /work/target/debug/ch-box, CH_RELEASE_KEY: "c802698987acc0a5003330bba30226936d12bbe609c99874ed5ed75a630da6bd", CH_UPDATE_GRACE_SECS: "45" }
    volumes:
      - ../:/work
      - ch-target:/work/target
      - box-a-data:/data
    ports: ["18080:80", "18443:443"]

  # One venue with three boxes (test-only venue key): venue sync, the venue console, replacing a box (FR-41…FR-43).
  venue-a:
    <<: *box
    profiles: ["venue"]
    environment:
      CH_DATA_DIR: /data
      CH_HTTP_ADDR: "0.0.0.0:80"
      CH_HTTPS_ADDR: "0.0.0.0:443"
      CH_BOX_NAME: box-a
      CH_SLOTS_DIR: /opt/court-highlights
      CH_SEED_BINARY: /work/target/debug/ch-box
      CH_RELEASE_KEY: "c802698987acc0a5003330bba30226936d12bbe609c99874ed5ed75a630da6bd"
      CH_PLAYER_URL: "http://localhost:18180"
      CH_SUPPORT_PHONE: "0917 555 0100"
      CH_VENUE_KEY: "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
      CH_PEERS: "https://venue-b:8444,https://venue-c:8444"
      CH_SYNC_SECS: "3"
    volumes:
      - ../:/work
      - ch-target:/work/target
      - venue-a-data:/data
    ports: ["18180:80", "18543:443", "18446:8444"]
  venue-b:
    <<: *box
    profiles: ["venue"]
    environment:
      CH_DATA_DIR: /data
      CH_HTTP_ADDR: "0.0.0.0:80"
      CH_HTTPS_ADDR: "0.0.0.0:443"
      CH_BOX_NAME: box-b
      CH_SLOTS_DIR: /opt/court-highlights
      CH_SEED_BINARY: /work/target/debug/ch-box
      CH_RELEASE_KEY: "c802698987acc0a5003330bba30226936d12bbe609c99874ed5ed75a630da6bd"
      CH_PLAYER_URL: "http://localhost:18181"
      CH_SUPPORT_PHONE: "0917 555 0100"
      CH_VENUE_KEY: "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
      CH_PEERS: "https://venue-a:8444,https://venue-c:8444"
      CH_SYNC_SECS: "3"
    volumes:
      - ../:/work
      - ch-target:/work/target
      - venue-b-data:/data
    ports: ["18181:80", "18544:443"]
  venue-c:
    <<: *box
    profiles: ["venue"]
    environment:
      CH_DATA_DIR: /data
      CH_HTTP_ADDR: "0.0.0.0:80"
      CH_HTTPS_ADDR: "0.0.0.0:443"
      CH_BOX_NAME: box-c
      CH_SLOTS_DIR: /opt/court-highlights
      CH_SEED_BINARY: /work/target/debug/ch-box
      CH_RELEASE_KEY: "c802698987acc0a5003330bba30226936d12bbe609c99874ed5ed75a630da6bd"
      CH_PLAYER_URL: "http://localhost:18182"
      CH_SUPPORT_PHONE: "0917 555 0100"
      CH_VENUE_KEY: "5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e"
      CH_PEERS: "https://venue-a:8444,https://venue-b:8444"
      CH_SYNC_SECS: "3"
    volumes:
      - ../:/work
      - ch-target:/work/target
      - venue-c-data:/data
    ports: ["18182:80", "18545:443"]

volumes:
  venue-a-data: {}
  venue-b-data: {}
  venue-c-data: {}
  ch-target: { external: true }
  ch-cargo-registry: { external: true }
  box-a-data: {}
