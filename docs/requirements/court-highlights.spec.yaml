      assert: "Validate required configuration and minimal secret scopes (database, R2, SES, TOTP) at the bound target; fail closed when missing or wrong; no secret value enters artifacts"
      weight: 2
      traces: ["A-119","NFR-9"]
    - id: "HOST-persistence"
      assert: "Fleet records, registrations, sent items and blocked-address hashes survive a service restart and redeploy"
      weight: 2
      traces: ["FR-48","FR-49","FR-25"]
    - id: "HOST-compatibility"
      assert: "Schema migrations apply forward on a copy of the previous release's data and the previous release keeps working until cut-over (or a documented rollback path exists)"
      weight: 2
      traces: ["NFR-12","A-47"]
    - id: "HOST-backup"
      assert: "PostgreSQL 18 backups are enabled at the target and an off-provider dump to R2 is produced"
      weight: 2
      traces: ["A-119","NFR-16"]
    - id: "HOST-restore"
      assert: "A synthetic backup restores into an isolated environment and the fleet console works against it"
      weight: 2
      traces: ["A-119"]
    - id: "HOST-container-image"
      assert: "The container image is pinned by digest, built from the reviewed commit, and scanned with no unpatched Critical/High finding"
      weight: 2
      traces: ["NFR-9","NFR-11"]
    - id: "DEV-SPIKE"
      assert: "The pre-registered feasibility spike (stack-decision.md Confirmation H1–H5: 24 h gap-free recording, clip p95 ≤ 10 s, 4 × 1 h judged ≤ 60 min, camera resume ≤ 5 s, injected failing update rolls back) runs on the N150 box with ≥ 5 runs; confirmation-results.md shows every threshold met before product scaffolding beyond the spike; a miss supersedes the decision and returns to the owner"
      weight: 2
      traces: ["A-123","NFR-1","NFR-2","NFR-3","NFR-12"]
    - id: "DEV-INSTALL-IMAGE"
      assert: "A box installs from the USB image to the first-run wizard in ≤ 30 min (timed)"
      weight: 2
      traces: ["NFR-13","FR-40","A-46","A-126"]
    - id: "DEV-UPDATE-ROLLBACK"
      assert: "An injected failing update (from the fleet and from USB) returns the box to its previous version within 10 min of first boot, shows \"Update rolled back\", and the venue's other boxes are not updated"
      weight: 2
      traces: ["FR-51","FR-54","NFR-12","SC-9"]
    - id: "DEV-REPLACE-BOX"
      assert: "A replaced box joins the venue and receives courts, logo, settings and staff from its siblings within 1 min; a single-box venue restores the settings backup file"
      weight: 2
      traces: ["FR-43","FR-44","SC-9"]
    - id: "DEV-ENVIRONMENTS"
      assert: "CI runs the suites on the owner-laptop profile with replayed RTSP cameras and on the test box; no test targets a live venue"
      weight: 2
      traces: ["NFR-18","A-48"]
    - id: "DEV-PAYLOAD"
      assert: "Shipped UI assets stay within the planning budget in assets/manifest.json (each file ≤ 60 KB, total ≤ 150 KB)"
      weight: 2
      traces: ["A-107"]
    - id: "DEV-COST-MODEL"
      assert: "The cost model with pinned R2/SES/DigitalOcean prices under the year-1 upper-bound usage stays ≤ US$100/month"
      weight: 2
      traces: ["NFR-16","A-117","A-118"]
    - id: "DEV-HORIZON"
      assert: "Every pinned OS, runtime and AI-runtime component is supported through 2030-06-30 (release checklist against endoflife data)"
      weight: 2
      traces: ["NFR-11","A-116"]
  monitoring:
    - id: "HOST-health"
      assert: "Non-sensitive liveness and protected readiness on the online service; simulated database/storage outage shows unhealthy without leaking details"
      weight: 2
      traces: ["A-81","NFR-14"]
    - id: "HOST-observability"
      assert: "Structured logs and metrics for uploads, emails, check-ins and fleet actions reach the approved sink without player emails or keys"
      weight: 2
      traces: ["NFR-15","FR-52"]
    - id: "HOST-container-health"
      assert: "The container declares a health check that the platform uses to restart it"
      weight: 2
      traces: ["A-81"]
    - id: "MON-CLIP-SPEED"
      assert: "With a box recording 4 courts and encoding one 720p game video, a clip is ready ≤ 10 s after its window ends for ≥ 95 of 100 taps (≥ 5 runs, p95 reported)"
      weight: 2
      traces: ["NFR-1","A-44","golden:GV-25"]
    - id: "MON-RECORDING-GAPS"
      assert: "A 24 h soak with 4 replayed streams per box shows no gap > 2 s per court, including while sending online"
      weight: 2
      traces: ["NFR-2","A-44"]
    - id: "MON-JUDGE-THROUGHPUT"
      assert: "With all 4 courts stopping 1-hour games at once, every reel is ready ≤ 60 min after Stop while clip speed and continuity hold"
      weight: 2
      traces: ["NFR-3","A-93","A-99"]
    - id: "MON-CAMERA"
      assert: "An unplugged camera turns its court red within 10 s and recording resumes ≤ 5 s after the stream returns"
      weight: 2
      traces: ["FR-3","A-61","A-126"]
    - id: "MON-HEALTH-PAGE"
      assert: "The health page shows per court recording/camera/last clip and per box disk/temperature/version/reachability; a disk at 80 % shows the warning"
      weight: 2
      traces: ["FR-36","FR-46","A-65"]
    - id: "MON-FLEET-CHECKINS"
      assert: "Online boxes check in every 60 s; a box silent for 5 min is flagged in the fleet console; health records older than 90 days are removed"
      weight: 2
      traces: ["FR-49","NFR-14","A-125","A-126"]
  hardening:
    - id: "HOST-container-nonroot"
      assert: "The online-service container runs as a non-root user with a read-only root filesystem where possible"
      weight: 2
      traces: ["NFR-9"]
    - id: "SEC-SN1-IDOR"
      assert: "Changing court or clip IDs in court-page and API requests (anonymous, other court, older than 2 h) returns nothing private and changes nothing (v5.0.0-8.2.2, 8.3.1)"
      weight: 2
      traces: ["FR-18","SN-1","A-10"]
    - id: "SEC-SN2-BRUTE-FORCE"
      assert: "5 consecutive wrong passwords lock the account for 15 min on every box; attempts are logged (v5.0.0-6.3.1, 16.3.1)"
      weight: 2
      traces: ["FR-28","SN-2","A-49"]
    - id: "SEC-SN3-REVOCATION"
      assert: "A deactivated staff member's existing session is refused on every box within 1 min; logout invalidates the session (v5.0.0-7.4.1, 7.4.2)"
      weight: 2
      traces: ["FR-29","SN-3","A-13"]
    - id: "SEC-SN4-UPLOAD"
      assert: "Logo upload refuses > 2 MB, renamed executables, SVG and non-PNG/JPEG content; nothing is stored (v5.0.0-5.2.1, 5.2.2)"
      weight: 2
      traces: ["FR-33","SN-4","A-52"]
    - id: "SEC-SN5-STOLEN-BOX"
      assert: "The box disk image mounted on another machine is unreadable; a revoked box key gets uploads and reports refused"
      weight: 2
      traces: ["NFR-8","FR-48","SN-5","A-50"]
    - id: "SEC-SN6-EMAIL-ABUSE"
      assert: "A 9th address is refused; guessed email-link tokens return nothing; blocked and hard-bounced addresses receive nothing (v5.0.0-2.4.1)"
      weight: 2
      traces: ["FR-20","FR-25","SN-6","A-86"]
    - id: "SEC-CROSS-VENUE"
      assert: "At the online service, venue A's box key cannot upload to, list or read venue B's items and venue A's email link cannot reach venue B's items (v5.0.0-8.2.2)"
      weight: 2
      traces: ["FR-48","NFR-9"]
    - id: "SEC-CSRF-CORS"
      assert: "Cross-site state changes against staff and fleet actions are refused without side effects; cookies are Secure with appropriate SameSite (v5.0.0-3.5.1, 3.3.1, 3.3.2)"
      weight: 2
      traces: ["NFR-9"]
    - id: "SEC-ROLES"
      assert: "Staff cannot reach Owner functions; a fleet Installer cannot switch venues, revoke keys or publish updates (v5.0.0-8.2.1)"
      weight: 2
      traces: ["FR-28","FR-47"]
    - id: "SEC-CREDENTIALS"
      assert: "Staff passwords ≥ 12 characters and checked against common passwords; argon2 hashing; no default accounts; temporary passwords forced to change and expired after 72 h unused (v5.0.0-6.2.1, 6.2.4, 11.4.2, 6.3.2, 6.4.1)"
      weight: 2
      traces: ["FR-29","FR-40","A-126"]
    - id: "SEC-FLEET-MFA"
      assert: "Fleet sign-in without the authenticator code is refused; fleet sessions have an inactivity timeout and an absolute lifetime (v5.0.0-6.3.3, 7.3.1, 7.3.2)"
      weight: 2
      traces: ["FR-47","A-104"]
    - id: "SEC-NO-FOOTAGE-IN-FLEET"
      assert: "An Admin session cannot list, view or download any clip, game video or footage through any fleet route or API"
      weight: 2
      traces: ["FR-53","A-81"]
    - id: "SEC-NO-AUDIO"
      assert: "Every produced clip, highlight, game video and export has no audio track even when the camera offers one"
      weight: 2
      traces: ["FR-2","A-37"]
    - id: "SEC-STAFF-TLS"
      assert: "Staff and Owner routes answer only over the box's own TLS certificate; plain-HTTP requests to them are refused or redirected; player pages carry no credentials (A-124 deviation recorded for HSTS)"
      weight: 2
      traces: ["A-124","FR-28"]
    - id: "SEC-ONLINE-TRANSPORT"
      assert: "The online service and fleet console use TLS 1.2/1.3 with publicly trusted certificates, HSTS ≥ 1 year and a CSP (v5.0.0-12.1.1, 12.2.1, 12.2.2, 3.4.1, 3.4.3)"
      weight: 2
      traces: ["NFR-9"]
    - id: "SEC-INJECTION"
      assert: "SQL and script payloads in email, staff, court-name and settings fields cause no execution and render inert (v5.0.0-1.2.4, 1.2.1)"
      weight: 2
      traces: ["NFR-9"]
    - id: "SEC-LOGS-NO-PII"
      assert: "Box and service logs contain no player emails, passwords, session tokens or keys during the full e2e run (v5.0.0-16.2.5)"
      weight: 2
      traces: ["NFR-15","A-66"]
    - id: "SEC-SECRETS"
      assert: "No secrets in source, images, artifacts or logs; box keys sealed on the box; online secrets in a managed store (v5.0.0-13.3.1); secret scan clean"
      weight: 2
      traces: ["NFR-9","A-125"]
    - id: "SEC-VENUE-SYNC"
      assert: "A device without the venue key cannot call box sync interfaces; box-to-box traffic is encrypted (v5.0.0-12.3.3)"
      weight: 2
      traces: ["FR-42","A-125"]
    - id: "SEC-WIPE"
      assert: "After Wipe box no clip, footage, account or log data remains on the disk and the fleet no longer lists the box"
      weight: 2
      traces: ["FR-55","A-70"]
    - id: "SEC-LICENCE"
      assert: "The SBOM licence check finds no GPL/AGPL component in the shipped box software and no GPL GStreamer plugin; LGPL parts are dynamically linked"
      weight: 2
      traces: ["NFR-10","A-114"]
    - id: "SEC-DEPENDENCIES"
      assert: "Zero unpatched reviewed advisories for shipped crates and system packages at release (OSV/cargo audit); no unresolved Critical/High finding"
      weight: 2
      traces: ["NFR-9","NFR-11"]
    - id: "PERF-LIBRARY-QUERIES"
      assert: "The clip library issues a bounded number of database queries independent of page size (no N+1) and never returns more than 50 rows per page"
      weight: 2
      traces: ["FR-31","A-73"]
    - id: "PERF-UPLOAD-CAP"
      assert: "Online sending respects the installer's upload cap and does not cause recording gaps or clip-speed misses"
      weight: 2
      traces: ["FR-22","NFR-1","NFR-2"]
