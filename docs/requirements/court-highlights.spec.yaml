  functional:
    - id: "F-RECORD"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): during opening hours each court records by stream copy (segment codec parameters equal the source, no audio track) and keeps the last 4 h; outside hours nothing is recorded"
      weight: 2
      traces: ["FR-1","A-17","A-56","SC-5"]
    - id: "F-CLIP"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): scan a court code, tap Clip that, see the ring, then a clip whose window is 25 s before to 5 s after the tap appears and downloads as MP4 (wide and vertical) on Android and iPhone browser profiles"
      weight: 2
      traces: ["FR-4","FR-7","FR-19","FR-8","SC-1","US-1","US-4"]
    - id: "F-MERGE"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): three taps within 5 s on the court page produce exactly one clip in the court page and library"
      weight: 2
      traces: ["FR-5","SC-1"]
    - id: "F-BRAND"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the venue logo set to a chosen corner appears in that corner in sampled frames of a clip, a highlight and a game video, in both shapes"
      weight: 2
      traces: ["FR-6","FR-33","US-5","A-19"]
    - id: "F-HIDE-DELETE"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): a player hides a clip from the court page (gone from the page, never sent); staff delete a clip (gone from the library) and the activity log names who and when"
      weight: 2
      traces: ["FR-9","FR-26","SC-7"]
    - id: "F-GAME"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): Start shows \"Recording since …\" on every phone on that court; a second phone sees the running game and the Stop offer; Stop yields a downloadable full-quality game video and a queued 720p copy"
      weight: 2
      traces: ["FR-10","FR-12","SC-2","US-2"]
    - id: "F-POSTING"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the Start screen shows \"The venue may post our highlights on its pages\" unticked; the choice is stored and shown as \"may post\" in the clip library"
      weight: 2
      traces: ["FR-11","A-101","SC-6"]
    - id: "F-PERSIST"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): persist-across-restart: after clips, a game, a hold, settings and a staff account are created through the UI, the box is power-cycled; all are present afterwards, recording resumes within 60 s of start-up, and a game cut by the power loss keeps its footage before the cut"
      weight: 2
      traces: ["FR-13","FR-56","A-34","A-60","SC-2"]
    - id: "F-HIGHLIGHTS"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): Stop on a pickleball game shows \"Highlights coming — about N min\", then a reel and single points labelled \"Highlights\" (no captions), wide and vertical, on the court page and in the game email; with the judge switched off no highlight message appears and the game video is still produced"
      weight: 2
      traces: ["FR-14","FR-15","FR-16","SC-10","US-10"]
    - id: "F-JUDGE-EVAL"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): scripted evaluation on the hand-marked partner-court test games (never used in training) meets NFR-17: ≥ 8 of 10 games with ≥ 3 of the top 5 matching marker picks and no dead time; each common shot kind meets the bar separately; rare kinds scored only with ≥ 10 examples"
      weight: 2
      traces: ["NFR-17","A-91","A-94","A-96"]
    - id: "F-COURT-PAGE"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): opening a court code without sign-in shows venue logo, court name, recording status, Clip that, game panel, email panel and this court's clips from the last 2 h, in that order"
      weight: 2
      traces: ["FR-17","A-112","A-9"]
    - id: "F-EMAIL"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): up to 8 addresses can be added to a running game and removed before sending; a clip outside a game offers Email me this; with the online service and a stub email provider reachable, each address receives one email per game with links and the expiry time, after which neither box nor service stores the address"
      weight: 2
      traces: ["FR-20","FR-21","FR-23","FR-57","SC-3","US-3"]
    - id: "F-STORE-FORWARD"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): with the network down, clipping and on-court download keep working; when it returns, items are sent clips/highlights first then 720p game videos, oldest game first, within the upload cap; a clip deleted after sending is withdrawn online"
      weight: 2
      traces: ["FR-22","FR-26","SC-12"]
    - id: "F-EXPIRY-LINK"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): with the test clock moved past the expiry moment, an email link shows \"These videos have expired\" and the box copy is gone after the 3:00 am clean-up"
      weight: 2
      traces: ["FR-24","FR-45","SC-3"]
    - id: "F-ONLINE-SWITCH"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): an Admin switches a venue off with a reason in the fleet console: court pages hide the email box with the agreed message, nothing is sent; switched back on, waiting items within expiry are sent"
      weight: 2
      traces: ["FR-27","FR-50","SC-13"]
    - id: "F-STAFF-CRUD"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the Owner creates a Staff account with a temporary password (forced change at first sign-in), resets it, deactivates it (sessions end on every box within 1 min); every staff member can change their own password"
      weight: 2
      traces: ["FR-29","FR-34","SC-8","US-12"]
    - id: "F-COURT-CRUD"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the Owner adds a court, assigns a camera found on the network and one entered by address, sees live previews, renames and deletes a court"
      weight: 2
      traces: ["FR-30","SC-4","US-6"]
    - id: "F-LIBRARY"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the clip library lists items from all three boxes, filters by court, date, type, kept and may-post, pages at 50, keeps (expiry shows the 1-year date), downloads both shapes, deletes with confirmation, and warns and logs when a not-permitted clip is downloaded for posting"
      weight: 2
      traces: ["FR-31","SC-6","US-8"]
    - id: "F-FOOTAGE"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): staff find Court 4 footage by time window, place a Hold (protected from overwrite), the Owner exports MP4, and a request for overwritten footage is recorded as \"footage no longer exists\"; each step is logged"
      weight: 2
      traces: ["FR-32","SC-7","US-11"]
    - id: "F-SETTINGS"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): venue settings (name, logo, logo corner, sponsor logo, opening hours, clip lengths, upload cap, judge on/off, privacy notice, time correction) save, survive restart, propagate to all boxes within 1 min and take effect on the next clip"
      weight: 2
      traces: ["FR-33","FR-38","FR-42","A-78"]
    - id: "F-LOG"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the activity log shows sign-ins, keep, delete, export, download-for-posting, holds, settings, staff and online-switch changes and exports to CSV without any email address"
      weight: 2
      traces: ["FR-35","A-51"]
    - id: "F-SIGNS"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): printing signs yields one page per court with that court's code and the agreed notice text, including \"no sound\", retention periods, contact and \"Under 18? Ask a parent first.\""
      weight: 2
      traces: ["FR-37","A-53","A-58"]
    - id: "F-ONBOARD"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): fresh-empty: a newly installed box opens the first-run wizard with no default account, no demo clips and no courts; completing it (owner password, venue, logo, hours, cameras, court names) leads to an empty library that explains how to make the first clip"
      weight: 2
      traces: ["FR-40","A-75","SC-4"]
    - id: "F-VENUE-CONSOLE"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): with three boxes, the console opened on any box shows all 12 courts; with one box powered off its courts show \"box unreachable since …\" and the others work"
      weight: 2
      traces: ["FR-41","SC-14"]
    - id: "F-HELP"
      assert: "E2E (Playwright, replayed court footage as RTSP cameras): the Help page shows the support number and hours"
      weight: 2
      traces: ["FR-39","A-67"]
