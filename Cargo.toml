[workspace]
resolver = "3"
members = ["crates/core", "crates/box"]
# The online service is its own workspace (own lockfile): sqlx and rusqlite pin different SQLite libraries.
exclude = ["crates/cloud"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug builds keep line tables only, and none for dependencies: the test target stays a few GB (the build disk is small).
[profile.dev]
debug = "line-tables-only"
# Every byte written lands on the small host disk until WSL restarts; incremental artifacts are hundreds of MB a build.
incremental = false

[profile.dev.package."*"]
debug = false
