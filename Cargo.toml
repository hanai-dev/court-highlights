[workspace]
resolver = "3"
members = ["crates/core", "crates/box"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
